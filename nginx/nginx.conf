worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Basic Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        
        # Hide Nginx version
        server_tokens off;

        # Route /auth to auth-service
        location /auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-auth-service:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/reminders to reminder-service
        location /api/reminders {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-reminder-service:3002/api/reminders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/notifications to notification-service
        location /api/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-notification-service:3003/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check for the gateway itself
        location /health {
            return 200 '{"status":"ok", "service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
