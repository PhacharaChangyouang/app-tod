worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Basic Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Allow local development clients on any localhost port.
    map $http_origin $cors_origin {
        default "";
        ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # CORS
        # Flutter Web uses a random local development port.
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key" always;

        # Handle CORS preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Hide Nginx version
        server_tokens off;

        # ==========================================
        # AUTH SERVICE
        # ==========================================
        # /auth/* -> auth-service:3001
        location /auth/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://aha-auth-service:3001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # REMINDER SERVICE
        # ==========================================
        # /api/reminders -> reminder-service:3002
        location /api/reminders {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://aha-reminder-service:3002/api/reminders;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # NOTIFICATION SERVICE
        # ==========================================
        # /api/notifications -> notification-service:3003
        location /api/notifications {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://aha-notification-service:3003/api/notifications;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # API GATEWAY HEALTH CHECK
        # ==========================================
        location /health {
            default_type application/json;

            return 200 '{"status":"ok","service":"api-gateway"}';
        }
    }
}