worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    map $http_origin $cors_origin {
        default "";
        ~^https?://(localhost|127\.0\.0\.1|192\.168\.1\.146)(:[0-9]+)?$ $http_origin;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Internal-API-Key" always;

        if ($request_method = OPTIONS) { return 204; }
        server_tokens off;

        location /auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-auth-service:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /family/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-auth-service:3001/family/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/reminders {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-reminder-service:3002/api/reminders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://aha-notification-service:3003/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }
    }
}
