services:
  api-gateway:
    image: nginx:alpine
    container_name: aha-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - reminder-service
      - notification-service
    networks:
      - aha-network
    restart: unless-stopped

  auth-service:
    build: ./backend/auth-service
    container_name: aha-auth-service
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      REGISTRATION_ENABLED: "true"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      NOTIFICATION_SERVICE_URL: http://aha-notification-service:3003
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth-db:
    image: postgres:16-alpine
    container_name: aha-auth-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

  reminder-service:
    build: ./backend/reminder-service
    container_name: aha-reminder-service
    env_file:
      - .env
    environment:
      PORT: 3002
      NODE_ENV: development
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      AUTH_SERVICE_URL: http://aha-auth-service:3001
      NOTIFICATION_SERVICE_URL: http://aha-notification-service:3003
      DB_HOST: reminder-db
      DB_PORT: 5432
      DB_NAME: reminder_db
      DB_USER: postgres
    depends_on:
      reminder-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  reminder-db:
    image: postgres:16-alpine
    container_name: aha-reminder-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: reminder_db
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - reminder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reminder_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

  notification-service:
    build: ./backend/notification-service
    container_name: aha-notification-service
    env_file:
      - .env
    environment:
      PORT: 3003
      NODE_ENV: development
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      AUTH_SERVICE_URL: http://aha-auth-service:3001
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: postgres
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  notification-db:
    image: postgres:16-alpine
    container_name: aha-notification-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

networks:
  aha-network:
    name: aha-network
    driver: bridge

volumes:
  auth-db-data:
  reminder-db-data:
  notification-db-data:
