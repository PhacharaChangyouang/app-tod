services:
  api-gateway:
    image: nginx:alpine
    container_name: aha-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - reminder-service
      - notification-service
    networks:
      - aha-network
    restart: unless-stopped

  auth-service:
    build: ./backend/auth-service
    container_name: aha-auth-service
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      OTP_MOCK_MODE: "true"
      OTP_MOCK_CODE: "123456"
      OTP_EXPIRES_IN_MINUTES: 5
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: aha-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

  reminder-service:
    build: ./backend/reminder-service
    container_name: aha-reminder-service
    env_file:
      - .env
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@reminder-db:5432/reminder_db
    depends_on:
      reminder-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped

  reminder-db:
    image: postgres:16-alpine
    container_name: aha-reminder-db
    environment:
      POSTGRES_DB: reminder_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - reminder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reminder_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

  notification-service:
    build: ./backend/notification-service
    container_name: aha-notification-service
    env_file:
      - .env
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@notification-db:5432/notification_db
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - aha-network
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    container_name: aha-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aha-network

networks:
  aha-network:
    name: aha-network
    driver: bridge

volumes:
  auth-db-data:
  reminder-db-data:
  notification-db-data: