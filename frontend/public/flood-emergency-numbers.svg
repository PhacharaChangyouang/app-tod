<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">เบอร์ฉุกเฉินน้ำท่วม</title>
  <desc id="desc">สายด่วน ปภ. 1784 และการแพทย์ฉุกเฉิน 1669</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#f7fcff"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#177cb5"/><stop offset="1" stop-color="#074b7a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#083d5d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="900" height="1080" rx="38" fill="url(#sky)"/>
  <circle cx="742" cy="138" r="72" fill="#ffd35c" opacity=".95"/>
  <path d="M0 310 Q120 255 240 310 T480 310 T720 310 T960 310 V1080 H0Z" fill="#b8e8fa"/>
  <path d="M0 350 Q120 295 240 350 T480 350 T720 350 T960 350 V1080 H0Z" fill="url(#water)"/>
  <g transform="translate(85 72)">
    <rect width="730" height="210" rx="30" fill="#fff" filter="url(#shadow)"/>
    <text x="365" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111111">เก็บไว้ใช้ยามฉุกเฉิน</text>
    <text x="365" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#000000">เบอร์ฉุกเฉินน้ำท่วม</text>
    <text x="365" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#333333">ตั้งสติ · บอกตำแหน่ง · แจ้งจำนวนผู้ประสบภัย</text>
  </g>
  <g transform="translate(85 405)" filter="url(#shadow)">
    <rect width="730" height="220" rx="32" fill="#fff"/>
    <circle cx="120" cy="110" r="72" fill="#e8f6fc"/>
    <path d="M91 137h58v-44l-29-23-29 23z" fill="#1677a8"/><path d="M78 96l42-34 42 34" fill="none" stroke="#1677a8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="226" y="70" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222222">แจ้งเหตุสาธารณภัย / ขอความช่วยเหลือ</text>
    <text x="226" y="145" font-family="Arial, sans-serif" font-size="74" font-weight="900" fill="#000000">1784</text>
    <text x="520" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#222222">สายด่วน ปภ.</text>
  </g>
  <g transform="translate(85 660)" filter="url(#shadow)">
    <rect width="730" height="220" rx="32" fill="#fff"/>
    <circle cx="120" cy="110" r="72" fill="#fff0f0"/>
    <path d="M120 62v96M72 110h96" stroke="#db3d4d" stroke-width="25" stroke-linecap="round"/>
    <text x="226" y="70" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#222222">เจ็บป่วยหรือบาดเจ็บฉุกเฉิน</text>
    <text x="226" y="145" font-family="Arial, sans-serif" font-size="74" font-weight="900" fill="#000000">1669</text>
    <text x="520" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#222222">แพทย์ฉุกเฉิน</text>
  </g>
  <g transform="translate(105 932)">
    <text x="345" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#fff">หากอยู่ในพื้นที่เสี่ยง ให้ติดตามประกาศจากหน่วยงานท้องถิ่น</text>
    <text x="345" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">AHA · AI Health Assistant</text>
  </g>
